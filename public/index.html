<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إكس أو - أونلاين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Cairo", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(10px);
    }

    .btn {
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      transition: transform 0.15s, filter 0.15s;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.15); }
    .btn-primary { background: linear-gradient(90deg, #ff6b6b, #ee5253); color: #fff; }
    .btn-secondary { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; border: 2px solid #4ecdc4; }

    input {
      font-family: inherit;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
    }
    input:focus { outline: none; border-color: #4ecdc4; }
    input::placeholder { color: rgba(255,255,255,0.4); font-size: 1rem; }

    #codeInput { letter-spacing: 8px; text-transform: uppercase; direction: ltr; font-size: 1.2rem; }
    #codeInput::placeholder { letter-spacing: 2px; font-size: 1rem; }

    .error { color: #ff6b6b; margin-top: 10px; font-size: 0.95rem; min-height: 1.4em; }
    .hidden { display: none; }

    /* ---- شاشة الغرفة ---- */
    .room-code-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
    }
    .room-code-box .label { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
    .room-code-box .code {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 10px;
      direction: ltr;
      color: #ffd93d;
      user-select: all;
      cursor: pointer;
    }
    .room-code-box .hint { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 4px; }

    /* ---- لوحة السكور ---- */
    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .score-side {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 100px;
      opacity: 0.5;
      transition: opacity 0.3s;
    }
    .score-side.active { opacity: 1; }
    .score-side .who { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score-side .who.x { color: #ff6b6b; }
    .score-side .who.o { color: #4ecdc4; }
    .score-side .pts { font-size: 1.6rem; font-weight: 900; line-height: 1; }
    .score-side.right { text-align: left; }
    .score-side.left { text-align: right; }
    .vs { font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.5); }

    .status {
      font-size: 1.15rem;
      font-weight: 700;
      min-height: 2em;
      margin-bottom: 14px;
    }
    .status .waiting { color: #ffd93d; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    /* ---- اللوحة ---- */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 320px;
      margin: 0 auto;
    }
    .cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      font-size: 2.8rem;
      font-weight: 900;
      font-family: inherit;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }
    .cell:disabled { cursor: default; }
    .cell.x { color: #ff6b6b; }
    .cell.o { color: #4ecdc4; }
    .cell.win { background: rgba(255, 217, 61, 0.25); border-color: #ffd93d; animation: pop 0.4s; }
    @keyframes pop { 0% { transform: scale(0.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

    .result {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 16px 0 6px;
      min-height: 1.6em;
    }
    .result.win-x { color: #ff6b6b; }
    .result.win-o { color: #4ecdc4; }
    .result.draw { color: #ffd93d; }

    /* ---- الشات ---- */
    .chat {
      margin-top: 18px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      overflow: hidden;
    }
    .chat-title {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      padding: 8px 12px 0;
      text-align: right;
    }
    .chat-messages {
      height: 130px;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: right;
    }
    .chat-messages .msg { font-size: 0.88rem; line-height: 1.5; word-break: break-word; }
    .chat-messages .msg .who { font-weight: 900; }
    .chat-messages .msg.me .who { color: #ffd93d; }
    .chat-messages .msg.him .who { color: #a29bfe; }
    .chat-messages .empty { color: rgba(255,255,255,0.35); font-size: 0.85rem; text-align: center; margin-top: 30px; }
    .chat-form { display: flex; gap: 8px; padding: 8px; }
    .chat-form input {
      margin-top: 0;
      padding: 10px 12px;
      font-size: 0.95rem;
      text-align: right;
      flex: 1;
    }
    .chat-form button {
      font-family: inherit;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: #4ecdc4;
      color: #16213e;
      padding: 0 18px;
      cursor: pointer;
    }
    .chat-form button:hover { filter: brightness(1.1); }

    footer { margin-top: 20px; font-size: 0.8rem; color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ إكس أو أونلاين</h1>

    <!-- شاشة البداية -->
    <div id="homeScreen" class="card">
      <input id="nickInput" maxlength="15" placeholder="اكتب اسمك هنا" autocomplete="off" />
      <button class="btn btn-primary" id="createBtn">🎮 أنشئ غرفة جديدة</button>
      <div style="margin: 18px 0 4px; color: rgba(255,255,255,0.5);">— أو —</div>
      <input id="codeInput" maxlength="4" placeholder="اكتب كود الغرفة" autocomplete="off" />
      <button class="btn btn-secondary" id="joinBtn">🚪 ادخل الغرفة</button>
      <div class="error" id="errorMsg"></div>
    </div>

    <!-- شاشة اللعبة -->
    <div id="gameScreen" class="card hidden">
      <div class="room-code-box">
        <div class="label">كود الغرفة (ابعته لصاحبك)</div>
        <div class="code" id="roomCode" title="اضغط للنسخ">----</div>
        <div class="hint">اضغط على الكود لنسخه</div>
      </div>

      <!-- لوحة السكور -->
      <div class="scoreboard">
        <div class="score-side right" id="sideX">
          <span class="who x" id="nameX">—</span>
          <span class="pts" id="scoreX">0</span>
        </div>
        <div class="vs">VS</div>
        <div class="score-side left" id="sideO">
          <span class="who o" id="nameO">—</span>
          <span class="pts" id="scoreO">0</span>
        </div>
      </div>

      <div class="status" id="status"></div>

      <div class="board" id="board"></div>
      <div class="result" id="result"></div>
      <button class="btn btn-secondary hidden" id="rematchBtn">🔄 إعادة اللعب</button>
      <button class="btn btn-primary" id="leaveBtn" style="margin-top:12px">🚪 خروج من الغرفة</button>

      <!-- الشات -->
      <div class="chat">
        <div class="chat-title">💬 شات</div>
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" maxlength="200" placeholder="اكتب رسالة..." autocomplete="off" />
          <button type="submit">إرسال</button>
        </form>
      </div>
    </div>

    <footer>الفائز بياخد نقطة في السكور — إعادة اللعب بتبدّل الرموز والشات بيفضل لحد ما الغرفة تختفي</footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // عناصر الشاشة
    const homeScreen = document.getElementById("homeScreen");
    const gameScreen = document.getElementById("gameScreen");
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const roomCodeEl = document.getElementById("roomCode");
    const rematchBtn = document.getElementById("rematchBtn");
    const errorMsg = document.getElementById("errorMsg");
    const nickInput = document.getElementById("nickInput");
    const chatMessagesEl = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");

    let mySymbol = null;

    // نفتكر اسمه من آخر مرة (محلياً في المتصفح)
    nickInput.value = localStorage.getItem("xo-nickname") || "";

    // ---- إنشاء 9 خانات مرة واحدة ----
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.addEventListener("click", () => socket.emit("play", i));
      boardEl.appendChild(cell);
      cells.push(cell);
    }

    // ---- أزرار الشاشة الرئيسية ----
    document.getElementById("createBtn").addEventListener("click", () => {
      if (!getNickname()) return;
      socket.emit("createRoom", getNickname());
    });
    document.getElementById("joinBtn").addEventListener("click", joinRoom);
    document.getElementById("codeInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") joinRoom();
    });
    document.getElementById("leaveBtn").addEventListener("click", () => location.reload());
    document.getElementById("rematchBtn").addEventListener("click", () => socket.emit("rematch"));

    // ---- الشات ----
    document.getElementById("chatForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      socket.emit("chat", text);
      chatInput.value = "";
    });

    function addChatMsg(msg) {
      const empty = chatMessagesEl.querySelector(".empty");
      if (empty) empty.remove();

      const div = document.createElement("div");
      div.className = "msg " + (msg.from === mySymbol ? "me" : "him");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = msg.name + ": ";
      div.appendChild(who);
      div.appendChild(document.createTextNode(msg.text));
      chatMessagesEl.appendChild(div);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    socket.on("chatMsg", addChatMsg);

    // نسخ كود الغرفة
    roomCodeEl.addEventListener("click", () => {
      navigator.clipboard.writeText(roomCodeEl.textContent).then(() => {
        const hint = roomCodeEl.parentElement.querySelector(".hint");
        hint.textContent = "✅ اتنسخ!";
        setTimeout(() => (hint.textContent = "اضغط على الكود لنسخه"), 1500);
      });
    });

    // الاسم: من غيره مفيش لعب
    function getNickname() {
      const nick = nickInput.value.trim();
      if (!nick) {
        errorMsg.textContent = "اكتب اسمك الأول 😄";
        nickInput.focus();
        return null;
      }
      localStorage.setItem("xo-nickname", nick);
      errorMsg.textContent = "";
      return nick;
    }

    function joinRoom() {
      const nick = getNickname();
      if (!nick) return;
      const code = document.getElementById("codeInput").value.trim();
      if (code.length !== 4) {
        errorMsg.textContent = "الكود لازم يكون 4 حروف";
        return;
      }
      socket.emit("joinRoom", { code, nickname: nick });
    }

    // ---- من السيرفر ----
    socket.on("joined", (data) => {
      mySymbol = data.symbol;
      roomCodeEl.textContent = data.code;
      homeScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
      errorMsg.textContent = "";

      // شات الغرفة: نفضي ونحمّل اللي موجود (لو دخلنا غرفة فيها رسايل قديمة)
      chatMessagesEl.innerHTML = "";
      if (data.messages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "مفيش رسايل — قول سلام 👋";
        chatMessagesEl.appendChild(empty);
      } else {
        data.messages.forEach(addChatMsg);
      }

      updateUI(data);
    });

    socket.on("gameUpdate", updateUI);

    socket.on("error-msg", (msg) => {
      errorMsg.textContent = msg;
    });

    // ---- تحديث الواجهة من حالة السيرفر ----
    function updateUI(state) {
      // اللوحة
      state.board.forEach((value, i) => {
        const cell = cells[i];
        cell.textContent = value === "X" ? "✕" : value === "O" ? "◯" : "";
        cell.className = "cell" + (value ? " " + value.toLowerCase() : "");
        cell.disabled = value !== "" || state.playerCount < 2 || !!state.winner || state.turn !== mySymbol;
      });

      // تمييز خانات الفوز
      if (state.winningLine) {
        state.winningLine.forEach((i) => cells[i].classList.add("win"));
      }

      // السكور والأسماء
      const nameX = document.getElementById("nameX");
      const nameO = document.getElementById("nameO");
      nameX.textContent = "✕ " + (state.names.X || "...");
      nameO.textContent = "◯ " + (state.names.O || "...");
      document.getElementById("scoreX").textContent = state.scores.X;
      document.getElementById("scoreO").textContent = state.scores.O;

      // إبراز اللي دوره دلوقتي
      document.getElementById("sideX").classList.toggle("active", state.turn === "X" && !state.winner && state.playerCount === 2);
      document.getElementById("sideO").classList.toggle("active", state.turn === "O" && !state.winner && state.playerCount === 2);

      // الحالة
      resultEl.textContent = "";
      resultEl.className = "result";
      rematchBtn.classList.add("hidden");

      if (state.playerCount < 2) {
        statusEl.innerHTML = '<span class="waiting">⏳ مستني صاحبك يدخل بالكود...</span>';
        return;
      }

      if (state.winner) {
        if (state.winner === "draw") {
          statusEl.textContent = "انتهت الماتش";
          resultEl.textContent = "🤝 تعادل!";
          resultEl.className = "result draw";
        } else if (state.winner === mySymbol) {
          statusEl.textContent = "انتهت الماتش";
          resultEl.textContent = "🎉 كسبت يا " + state.names[mySymbol] + "!";
          resultEl.className = "result " + (mySymbol === "X" ? "win-x" : "win-o");
        } else {
          statusEl.textContent = "انتهت الماتش";
          resultEl.textContent = "😢 خسرت";
          resultEl.className = "result " + (mySymbol === "X" ? "win-o" : "win-x");
        }
        rematchBtn.classList.remove("hidden");
        if (state.rematchVotes > 0) {
          statusEl.textContent = "⏳ صاحبك عايز إعادة...";
        }
        return;
      }

      if (state.opponentLeft) {
        statusEl.innerHTML = '<span class="waiting">🚪 صاحبك خرج من الغرفة</span>';
        return;
      }

      statusEl.textContent = state.turn === mySymbol ? "👉 دورك!" : "⏳ دور صاحبك...";
    }
  </script>
</body>
</html>
